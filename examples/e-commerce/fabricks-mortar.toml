# E-Commerce Platform
# Multi-service microservices application demonstrating Fabricks patterns
#
# NOTE: This example uses in-memory storage for simplicity.
# The architecture demonstrates how you would structure a real
# e-commerce platform with multiple service tiers.

mortar_version = "1.0"

[project]
name = "e-commerce"
version = "1.0.0"
description = "E-commerce platform with microservices architecture"

# =============================================================================
# Variables
# =============================================================================

[variable.log_level]
type = "string"
default = "info"
description = "Log level for all services"

# =============================================================================
# Networks
# =============================================================================

[network.dmz]
description = "Public-facing gateway tier"
ingress = "0.0.0.0/0"
egress = ["application"]

[network.application]
description = "Business logic tier"
internal = true
ingress = ["dmz"]

# =============================================================================
# Services - API Gateway (Entry Point)
# =============================================================================

[service.api-gateway]
build = "./services/api-gateway"
type = "http"
networks = ["dmz", "application"]
ports = ["8085:8085"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.api-gateway.replicas]
min = 1
max = 10
cpu_threshold = 70

[service.api-gateway.resources]
memory = "256Mi"
cpu = 0.5

[service.api-gateway.health_check.http]
path = "/health"
interval = "10s"

# =============================================================================
# Services - Product Service
# =============================================================================

[service.product]
build = "./services/product"
type = "http"
networks = ["application"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.product.replicas]
min = 1
max = 5
cpu_threshold = 70

[service.product.resources]
memory = "256Mi"
cpu = 0.5

[service.product.health_check.http]
path = "/health"
port = 8081
interval = "30s"

# =============================================================================
# Services - Cart Service
# =============================================================================

[service.cart]
build = "./services/cart"
type = "http"
networks = ["application"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.cart.replicas]
min = 1
max = 5
cpu_threshold = 70

[service.cart.resources]
memory = "256Mi"
cpu = 0.5

[service.cart.health_check.http]
path = "/health"
port = 8082
interval = "30s"

# =============================================================================
# Services - Order Service
# =============================================================================

[service.order]
build = "./services/order"
type = "http"
networks = ["application"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.order.replicas]
min = 1
max = 5
cpu_threshold = 70

[service.order.resources]
memory = "256Mi"
cpu = 0.5

[service.order.health_check.http]
path = "/health"
port = 8083
interval = "30s"

# =============================================================================
# Services - User Service
# =============================================================================

[service.user]
build = "./services/user"
type = "http"
networks = ["application"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.user.replicas]
min = 1
max = 5
cpu_threshold = 70

[service.user.resources]
memory = "256Mi"
cpu = 0.5

[service.user.health_check.http]
path = "/health"
port = 8084
interval = "30s"

# =============================================================================
# Validation
# =============================================================================

[validate]
require_health_checks = true
