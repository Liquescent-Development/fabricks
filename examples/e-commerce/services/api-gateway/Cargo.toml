[package]
name = "api-gateway"
version = "1.0.0"
edition = "2024"

[workspace]

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
pedantic = "allow"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "component:api-gateway"

[package.metadata.component.target.dependencies]
"wasi:http" = "0.2.9"
