# Prometheus Configuration
# Scrape configuration for Fabricks services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fabricks-monitor'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  # - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Fabricks daemon metrics
  - job_name: 'fabricksd'
    static_configs:
      - targets: ['fabricksd:9091']
    metrics_path: /metrics

  # Application services
  # Add your services here
  - job_name: 'fabricks-services'
    static_configs:
      - targets:
          - 'api:9090'
          - 'worker:9090'
    metrics_path: /metrics
    scrape_interval: 10s

  # Database metrics
  - job_name: 'databases'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
          - 'redis-exporter:9121'
    scrape_interval: 30s
