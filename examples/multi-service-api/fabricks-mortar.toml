# Multi-Service API Example
# Demonstrates a REST API with network segmentation
#
# NOTE: This example uses in-memory storage for simplicity.
# The architecture demonstrates how you would structure a real
# application with separate API and data tiers.

mortar_version = "1.0"

[project]
name = "multi-service-api"
version = "1.0.0"
description = "REST API demonstrating multi-service architecture"

# =============================================================================
# Variables
# =============================================================================

[variable.log_level]
type = "string"
default = "info"
description = "Log level for services"

# =============================================================================
# Networks
# =============================================================================

[network.public]
description = "Public-facing API tier"
ingress = "0.0.0.0/0"

# =============================================================================
# Services
# =============================================================================

[service.api]
build = "./services/api"
type = "http"
networks = ["public"]
ports = ["8080:8080"]

environment = { LOG_LEVEL = "${variable.log_level}" }

[service.api.resources]
memory = "256Mi"
cpu = 0.5

[service.api.replicas]
min = 1
max = 5
cpu_threshold = 70

[service.api.health_check.http]
path = "/health"
interval = "30s"

# =============================================================================
# Validation
# =============================================================================

[validate]
require_health_checks = true
